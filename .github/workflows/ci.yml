name: CI

# The quality gates CLAUDE.md names — lint at zero warnings, the Vitest suite,
# a production build — on every pull request and every push to main. Until
# 2026-10-23 the only check on a PR was Vercel's deploy, so a red test or a lint
# error only surfaced when someone happened to run them by hand.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR supersedes the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Test
        run: npm test

      # The build is what Vercel runs; catching an import or bundling error
      # here keeps a broken PR from reaching a preview deploy first.
      - name: Build
        run: npm run build
